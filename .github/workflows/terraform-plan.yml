# Place this file in your infra repo at: .github/workflows/terraform-plan.yml
#
# Triggered automatically on Pull Requests and by the GHAAgent via workflow_dispatch.
# Runs `terraform plan` and stores output as a workflow artifact.

name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to plan"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write   # to post PR comments
  id-token: write        # for OIDC auth to Azure

env:
  TF_VERSION: "1.7.0"
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find changed Terraform directories
        id: find-dirs
        run: |
          # Find all directories with .tf files that changed
          CHANGED_DIRS=$(git diff --name-only origin/main...HEAD \
            | grep '\.tf$' \
            | xargs -I{} dirname {} \
            | sort -u \
            | tr '\n' ' ')
          echo "dirs=$CHANGED_DIRS" >> $GITHUB_OUTPUT

      - name: Terraform Init & Plan
        id: plan
        run: |
          PLAN_OUTPUT=""
          for dir in ${{ steps.find-dirs.outputs.dirs }}; do
            echo "Planning: $dir"
            cd "$dir"
            terraform init -reconfigure \
              -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
              -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
              -backend-config="container_name=tfstate" \
              -backend-config="key=${dir//\//-}.tfstate"

            terraform plan -out=tfplan -no-color 2>&1 | tee plan_output.txt
            PLAN_OUTPUT+=$(cat plan_output.txt)
            PLAN_OUTPUT+="\n"
            cd -
          done

          # Save combined plan output
          echo "$PLAN_OUTPUT" > /tmp/combined_plan.txt

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-output
          path: /tmp/combined_plan.txt
          retention-days: 7

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('/tmp/combined_plan.txt', 'utf8');
            const summary = planOutput.match(/Plan: .+/)?.[0] || 'No changes.';

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Terraform Plan Results\n\n**${summary}**\n\n<details><summary>Full Plan Output</summary>\n\n\`
  \`\n${planOutput.slice(0, 60000)}\n\`\n</details>`
            });
